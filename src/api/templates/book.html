{% extends "app_base.html" %}
{% block title %}Reservar{% endblock %}
{% block heading %}Reservar{% endblock %}
{% block content %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form method="post" class="stack">
  <fieldset>
    <legend>Servicio</legend>
    <div class="segmented">
      {% for key, label in SERVICES.items() %}
      <label>
        <input type="radio" name="service" value="{{ key }}" {% if values.service == key %}checked{% endif %}>
        <span>{{ label }}</span>
      </label>
      {% endfor %}
    </div>
  </fieldset>

  <label>Polideportivo
    <input type="text" name="center" list="centers" value="{{ values.center or '' }}" maxlength="80" autocomplete="off" required>
    <datalist id="centers">
      {% for c in centers %}<option value="{{ c }}">{% endfor %}
    </datalist>
  </label>

  <div class="row">
    <label>Día
      <input type="date" name="slot_date" value="{{ values.slot_date }}" required>
    </label>
    <label>Hora
      <input type="time" name="slot_time" value="{{ values.slot_time or '' }}" step="900" required>
    </label>
  </div>

  <fieldset>
    <legend>¿Qué hago?</legend>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="mode" value="reservar" {% if values.mode == "reservar" %}checked{% endif %}>
        <span><strong>Reservar en la apertura</strong><small>Lo intento en cuanto se abra el turno.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="mode" value="observar" {% if values.mode == "observar" %}checked{% endif %}>
        <span><strong>Observar</strong><small>Para turnos completos: vigilo si se libera una plaza.</small></span>
      </label>
    </div>
  </fieldset>

  <label class="only-observe">Si se libera una plaza
    <select name="on_free">
      {% for key, label in ON_FREE.items() %}
      <option value="{{ key }}" {% if values.on_free == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="check">
    <input type="checkbox" name="dry_run" value="true" {% if values.dry_run or forced_dry_run %}checked{% endif %} {% if forced_dry_run %}disabled{% endif %}>
    <span>Modo prueba: recorre todo sin confirmar la reserva
      {% if forced_dry_run %}<small>Activado en el servidor (DRY_RUN=true).</small>{% endif %}
    </span>
  </label>

  <button class="btn btn-primary" type="submit">Programar</button>
</form>
{% endblock %}

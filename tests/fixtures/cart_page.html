     Sin nombres, correos ni datos de sesión reales. -->
<html lang="es">
<body>
  <div id="ContentFixedSection_uCarritoConfirmar_divCart">
    <ul class="list-group cart">
      <li class="list-group-item">
        <div>Persona de prueba</div>
        <div><span>SALA MUSCULACION</span><span>jueves, 1 de octubre de 2026</span><span>Sala Multitrabajo B</span>
          <div><span>Inicio</span><span>14:00</span></div><div><span>Fin</span><span>15:30</span></div></div>

    </ul>
  </div>
  <div id="ContentFixedSection_uCarritoConfirmar_divTerms" class="form-group"></div>
  <button id="ContentFixedSection_uCarritoConfirmar_btnConfirmCart" type="button">Confirmar la compra</button>

</html>
